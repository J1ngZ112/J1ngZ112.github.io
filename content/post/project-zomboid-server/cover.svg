    <text x="92" y="623" fill="#8ea79a" font-size="19">FENN / SERVER NOTES / 2026.10</text>
    <g fill="none" stroke="#d4aa64" stroke-width="3"><path d="M1070 355v110M1070 465H900v65M1070 465v65M1070 465h170v65"/><circle cx="1070" cy="465" r="7" fill="#d4aa64"/></g>
    <rect x="917" y="174" width="306" height="183" rx="20" fill="#192c2a" stroke="#789485" stroke-width="2"/>
    <g fill="#30483d" stroke="#789485"><rect x="944" y="202" width="252" height="48" rx="8"/><rect x="944" y="267" width="252" height="48" rx="8"/></g>
