<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">用阿里云 ECS 搭建僵尸毁灭工程服务器</title>
  <desc id="desc">深绿色背景上的云服务器与三位联机玩家，以橙色连线连接。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f22"/><stop offset="1" stop-color="#263d35"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#a8cab4" stroke-opacity=".06"/></pattern>
  </defs>
  <path fill="url(#bg)" d="M0 0h1440v720H0z"/><path fill="url(#grid)" d="M0 0h1440v720H0z"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
