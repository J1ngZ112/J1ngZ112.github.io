    <g fill="#20372f" stroke="#789485" stroke-width="2"><rect x="850" y="530" width="100" height="68" rx="10"/><rect x="1020" y="530" width="100" height="68" rx="10"/><rect x="1190" y="530" width="100" height="68" rx="10"/></g>
    <g fill="#b8ccc0" font-size="17" text-anchor="middle"><text x="900" y="571">玩家 A</text><text x="1070" y="571">玩家 B</text><text x="1240" y="571">玩家 C</text></g>
